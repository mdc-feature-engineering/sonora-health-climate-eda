[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sonora_health_climate_eda"
version = "0.1.0"
description = "EDA de vulnerabilidad socioeconómica y climática ante enfermedades respiratorias en Hermosillo, Sonora"
authors = [
  { name = "PatQz" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.13,<3.14"


[tool.ruff]
line-length = 99
src = ["sonora_health_climate_eda"]
include = ["pyproject.toml", "sonora_health_climate_eda/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["sonora_health_climate_eda"]
force-sort-within-sections = true
